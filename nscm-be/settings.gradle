pluginManagement {
    repositories {
        // 2026-05-26 로컬 개발: 사내 Nexus (10.94.57.6:8081) 접근 차단 → public 으로 대체
        // 원본 (사내) :
        //   maven { url "http://10.94.57.6:8081/repository/maven-public/"; allowInsecureProtocol true }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Foojay disco — JDK toolchain 자동 다운로드 (Java 21 등 부재 시 받아옴)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'nscm'
