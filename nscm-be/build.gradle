//    implementation files('lib/sso/external_v4.2.1.00_LGEnSol_38.jar')
//    implementation files('lib/sso/INICrypto_v4.2.8.jar')
//    implementation files('lib/sso/jdom.jar')
//    implementation files('lib/sso/log4j-1.2.16.jar')
//    implementation files('lib/sso/poolit.jar')
//    implementation files('lib/sso/xercesImpl.jar')

