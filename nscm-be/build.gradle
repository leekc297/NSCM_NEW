bootWar {
    archiveFileName = 'nscm.war'

    filesMatching("**/sapjco3-*.jar") {
        name = "sapjco3.jar"
    }

    // JCo가 내부에서 풀려서 실행되도록 강제함
    requiresUnpack '**/sapjco3.jar'

}

bootRun {
//    jvmArgs = ['-Djvm.jasypt-encryptor-password=ThisisWebFrameworkSecurityKey']
}



tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs.add("-parameters")
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}

spotless {
    lineEndings 'UNIX'

    java {
        // [수정] -PspotlessFiles 속성이 있으면 해당 파일만, 없으면 전체 src 폴더 대상
        if (project.hasProperty('spotlessFiles')) {
            target project.property('spotlessFiles').split(',').findAll { it.endsWith('.java') }
        } else {
            target 'src/**/*.java'
        }
        lineEndings 'UNIX'
        importOrder 'java', 'javax', 'org', 'com', ''
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        // [수정] 동일하게 -PspotlessFiles 속성이 있으면 해당 파일들만 필터링해서 타겟팅
        if (project.hasProperty('spotlessFiles')) {
            target project.property('spotlessFiles').split(',').findAll {
                it.endsWith('.yml') || it.endsWith('.gradle') || it.endsWith('.md')
            }
        } else {
            target '**/*.yml', '**/*.gradle', '**/*.md', '**/.gitignore'
        }

        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Git Hook 설치 Task
tasks.register('installGitHooks', Copy) {
  group = 'setup'
  description = 'Install the git hooks from scripts directory.'
    from new File(rootProject.rootDir, 'scripts/pre-commit')
    into new File(rootProject.rootDir, '.git/hooks')
    fileMode 0755
}

tasks.withType(Javadoc) {
    options {
        // 한글 깨짐 방지 설정 (필수)
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        docEncoding = 'UTF-8'

        // 커스텀 태그 등록: -tag "태그명:위치:헤더명"
        // 위치 'a' (all)는 클래스, 메서드, 필드 등 모든 곳에서 사용 가능함을 의미합니다.
        tags = [
            'Project:a:Project:',
            'Package:a:Package:',
            'FileName:a:File Name:',
            'date:a:Date:',
            'description:a:Description:'
        ]

        // 에러가 있어도 빌드를 중단하지 않으려면 (선택 사항)
        // failOnError = false
    }
}
