<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Vibe_Manager 컬러 아이콘 — Claude 팔레트(테라코타 #E8956F→#C55F3D, 크림 #F4EFE6, 잉크 #1F1E1D). AS-IS(좌)→Vibe 허브(하)→TO-BE(우) V 흐름, 팔의 점 = 단계, 허브 링 중심 = Claude -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8956F"/><stop offset="1" stop-color="#C55F3D"/></linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8F1"/><stop offset="1" stop-color="#F1E9DD"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5A2A18" flood-opacity=".35"/></filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#g)"/>
  <path d="M31 34 L58 86 Q64 97 70 86 L97 34" fill="none" stroke="url(#v)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#s)"/>
  <g fill="#1F1E1D" fill-opacity=".45"><circle cx="41" cy="53" r="3.3"/><circle cx="50" cy="70" r="3.3"/><circle cx="87" cy="53" r="3.3"/><circle cx="78" cy="70" r="3.3"/></g>
  <circle cx="31" cy="34" r="8.5" fill="#F4EFE6" filter="url(#s)"/><circle cx="97" cy="34" r="8.5" fill="#F4EFE6" filter="url(#s)"/>
  <circle cx="64" cy="94" r="12" fill="#1F1E1D" filter="url(#s)"/><circle cx="64" cy="94" r="6.5" fill="none" stroke="#F4EFE6" stroke-width="2.2"/><circle cx="64" cy="94" r="2.2" fill="#E8956F"/>
</svg>
